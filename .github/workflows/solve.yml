name: solve
on:
  workflow_dispatch:
    inputs:
      game: {description: "file in games/ (no .json)", default: cash6_probe}
      iters: {description: "max iterations", default: "300"}
      max_nodes: {description: "nodes to dump", default: "4000"}
jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: get GTOpen
        run: |
          set -x; date
          git clone --depth 1 https://github.com/MatthewPDingle/GTOpen.git gto
          cd gto && git log -1 --format='%H %cI %s' && du -sh . && nproc && free -g
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            gto/target
          key: gto-${{ hashFiles('gto/Cargo.lock') }}
      - name: build (cpu)
        run: cd gto && date && set -o pipefail; cargo build --release -p server 2>&1 | tail -40 && date && ls -la target/release | head -30
      - name: solve + dump
        run: |
          cd gto && (./target/release/gto-server > ../server.log 2>&1 &) 
          for i in $(seq 60); do curl -sf http://127.0.0.1:3737/api/version && break; sleep 2; done; echo
          python3 -u ../probe.py ../games/${{ inputs.game }}.json ../out ${{ inputs.iters }} ${{ inputs.max_nodes }}
      - name: server log
        if: always()
        run: tail -150 server.log; ls -la out gto/saves 2>/dev/null | head -40
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.game }}
          path: |
            out
            server.log
            gto/saves
          retention-days: 30
